name: insar4sm
channels:
  - conda-forge
dependencies:
  - python=3.11
  # InSAR4SM core
  - numpy
  - scipy
  - pandas
  - geopandas
  - shapely>=2.1
  - pyproj
  - gdal
  - libgdal-netcdf
  - rasterio
  - rioxarray
  - xarray
  - netcdf4
  - h5py
  - matplotlib
  - joblib
  - tqdm
  # ERA5-Land
  - cdsapi
  - cfgrib
  - eccodes
  # NISAR GSLC (remote windowed reads)
  - earthaccess
  - fsspec
  - aiohttp
  # Sentinel-1 bursts -> geocoded CSLC (isce3 is Linux/macOS only)
  - asf_search
  - burst2safe
  - s1reader
  - compass
  - isce3
  - dem_stitcher
  # notebook
  - jupyterlab
  - ipykernel
