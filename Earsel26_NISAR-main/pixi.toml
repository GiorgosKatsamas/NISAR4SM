[workspace]
authors = ["Kleanthis Karamvasis <kleanthis.karamvasis@moistx.com>"]
channels = ["conda-forge"]
name = "Earsel26_NISAR"
platforms = ["linux-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[feature.isce3.dependencies]
python = "==3.13"
pip = ">=25.2,<26"
jupyterlab = ">=4.4.10,<5"
ipykernel = ">=7.1.0,<8"
ipyleaflet = ">=0.20.0,<0.21"
ipywidgets = ">=8.1.0,<9"
numpy = ">=2.3.4,<3"
pandas = ">=2.3.3,<3"
xarray = ">=2026.2,<2027"
h5py = ">=3.13.0,<4"
h5netcdf = ">=1.8.1,<2"
pyproj = ">=3.7.0,<4"
rasterio = ">=1.4.0,<2"
geopandas = ">=1.0.0,<2"
shapely = ">=2.0.0,<3"
aiohttp = ">=3.10.0,<4"
earthaccess = ">=0.16.0,<0.17"
pygeogrids = ">=0.5.0,<0.6"
tqdm = ">=4.66.0,<5"

[environments]
default = ["isce3"]
isce3 = ["isce3"]
